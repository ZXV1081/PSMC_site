<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PSMC Support - Панель тикетов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Minecraft&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/support.css">
</head>
<body>
    <div class="container">
        <!-- Экран входа -->
        <div id="login-screen" class="auth-box">
            <h1 class="server-title">PSMC Support</h1>
            <p class="server-subtitle">Вход для сотрудников</p>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" required placeholder="support@psmc-online.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="action-btn primary">Войти</button>
                <p id="login-error" class="error-text"></p>
            </form>
        </div>

        <!-- Экран панели -->
        <div id="dashboard-screen" style="display: none;">
            <header class="dashboard-header">
                <h2><i class="fas fa-headset"></i> Тикеты</h2>
                <div>
                    <button id="settings-btn" class="action-btn secondary btn-icon" title="Настройки">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button id="logout-btn" class="action-btn secondary btn-icon" title="Выйти">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <div class="dashboard-layout">
                <!-- Список тикетов -->
                <aside class="ticket-list-panel">
                    <h3>Очередь</h3>
                    <div id="tickets-list"></div>
                </aside>

                <!-- Область переписки -->
                <main class="chat-panel" id="chat-panel">
                    <div class="empty-state">Выберите тикет для просмотра</div>
                </main>
            </div>
        </div>
    </div>
    
    <!-- Настройки профиля -->
    <div id="settings-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <button id="close-settings" class="modal-close">&times;</button>
            <h2>Настройки профиля</h2>
            <form id="settings-form">
                <div class="form-group">
                    <label>Ваш никнейм (для почты)</label>
                    <input type="text" id="set-nickname" placeholder="alex" required pattern="[a-zA-Z0-9._-]+">
                    <small>Будет использоваться как alex@psmc-online.ru</small>
                </div>
                <div class="form-group">
                    <label>Новый пароль (если меняете)</label>
                    <input type="password" id="set-password" minlength="6">
                </div>
                <button type="submit" class="action-btn primary">Сохранить</button>
                <p id="settings-msg" class="msg-text"></p>
            </form>
        </div>
    </div>

    <!-- Универсальное окно уведомлений (вместо alert) -->
    <div id="alert-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="max-width: 400px;">
            <h3 id="alert-title" style="color: var(--primary); margin-bottom: 15px;">Уведомление</h3>
            <p id="alert-message" style="margin-bottom: 25px; line-height: 1.5;"></p>
            <button id="alert-ok-btn" class="action-btn primary">Понятно</button>
        </div>
    </div>

    <!-- Скрипт -->
    <script type="module" src="js/support.js"></script>
</body>
</html>
