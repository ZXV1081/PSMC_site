<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PSMC - Сброс пароля</title>
    <link rel="stylesheet" href="css/support.css">
</head>
<body>
    <div class="container">
        <div class="auth-box">
            <h1 class="server-title">Новый пароль</h1>
            <p class="server-subtitle">Придумайте новый пароль для входа</p>
            
            <!-- Форма появится только если ссылка валидна -->
            <form id="reset-form" style="display: none;">
                <div class="form-group">
                    <label>Новый пароль</label>
                    <input type="password" id="new-password" required minlength="6">
                </div>
                <button type="submit" class="action-btn primary">Сохранить пароль</button>
                <p id="reset-error" class="error-text"></p>
                <p id="reset-success" style="color: var(--success); margin-top: 10px;"></p>
            </form>

            <!-- Сообщение об ошибке, если ссылка просрочена -->
            <div id="invalid-link" style="display: none; color: var(--danger);">
                <p>Ссылка для сброса пароля недействительна или устарела.</p>
                <a href="support.html" style="color: var(--primary);">Вернуться на страницу входа</a>
            </div>
        </div>
    </div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    
    // ⚠️ ВАШИ ДАННЫЕ
    const supabase = createClient('https://alhrersusznjnpnyqlcq.supabase.co', 'sb_publishable_B10yl_NY341a4H-BvjW78A_KyxZlDbQ')

    const form = document.getElementById('reset-form')
    const errorEl = document.getElementById('reset-error')
    const successEl = document.getElementById('reset-success')
    const invalidLink = document.getElementById('invalid-link')

    // 1. Извлекаем токены из хэша URL вручную
    const hash = window.location.hash.substring(1) // убираем #
    const params = new URLSearchParams(hash)
    
    const accessToken = params.get('access_token')
    const refreshToken = params.get('refresh_token')
    const type = params.get('type')

    // 2. Если это ссылка на восстановление и токены есть — устанавливаем сессию
    if (accessToken && refreshToken && type === 'recovery') {
        supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken,
        }).then(({ data, error }) => {
            if (error) {
                console.error('Ошибка установки сессии:', error)
                invalidLink.style.display = 'block'
            } else {
                // Сессия установлена, показываем форму
                form.style.display = 'block'
                // Очищаем хэш из URL, чтобы токены не оставались в истории браузера
                history.replaceState(null, '', window.location.pathname)
            }
        })
    } else {
        // Токенов нет или ссылка неверного типа
        invalidLink.style.display = 'block'
    }

    // 3. Обработка отправки формы
    form.addEventListener('submit', async (e) => {
        e.preventDefault()
        const newPassword = document.getElementById('new-password').value

        const { error } = await supabase.auth.updateUser({ password: newPassword })

        if (error) {
            errorEl.textContent = error.message
        } else {
            errorEl.textContent = ''
            successEl.textContent = 'Пароль успешно изменен! Перенаправляем...'
            setTimeout(() => {
                window.location.href = 'support.html'
            }, 2000)
        }
    })
</script>
</body>
</html>
