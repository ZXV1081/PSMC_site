<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSMC Support - Панель тикетов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Minecraft&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/support.css">
</head>
<body>
    <div class="container">
        <!-- Экран входа -->
        <div id="login-screen" class="auth-box">
            <h1 class="server-title">PSMC Support</h1>
            <p class="server-subtitle">Вход для сотрудников</p>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" required placeholder="support@psmc-online.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="action-btn primary">Войти</button>
                <p id="login-error" class="error-text"></p>
            </form>
        </div>

        <!-- Экран панели (Обязательно обернут в dashboard-screen!) -->
        <div id="dashboard-screen" style="display: none;">
            <header class="dashboard-header">
                <h2><i class="fas fa-headset"></i> Тикеты поддержки</h2>
                <div>
                    <button id="settings-btn" class="action-btn secondary" style="margin-right: 10px;">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button id="logout-btn" class="action-btn secondary">Выйти</button>
                </div>
            </header>

            <div class="dashboard-layout">
                <!-- Список тикетов -->
                <aside class="ticket-list-panel">
                    <h3>Очередь</h3>
                    <div id="tickets-list"></div>
                </aside>

                <!-- Область переписки -->
                <main class="chat-panel" id="chat-panel">
                    <div class="empty-state">Выберите тикет для просмотра</div>
                </main>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно настроек -->
    <div id="settings-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
        <div class="auth-box" style="margin:0; width:90%; max-width:400px; position:relative;">
            <button id="close-settings" style="position:absolute; top:15px; right:15px; background:none; border:none; color:var(--muted); font-size:1.5rem; cursor:pointer;">&times;</button>
            <h2 style="margin-bottom:20px; color:var(--primary);">Настройки профиля</h2>
            
            <form id="settings-form">
                <div class="form-group">
                    <label>Ваш никнейм (для почты)</label>
                    <input type="text" id="set-nickname" placeholder="Например: alex" required pattern="[a-zA-Z0-9._-]+">
                    <small style="color:var(--muted); font-size:0.8rem;">Будет использоваться как alex@psmc-online.ru</small>
                </div>
                
                <div class="form-group" style="margin-top:20px;">
                    <label>Новый пароль (оставьте пустым, если не меняете)</label>
                    <input type="password" id="set-password" minlength="6">
                </div>

                <button type="submit" class="action-btn primary">Сохранить изменения</button>
                <p id="settings-msg" style="text-align:center; margin-top:15px; font-weight:bold;"></p>
            </form>
        </div>
    </div>

    <!-- Скрипт подключается в самом конце! -->
    <script type="module" src="js/support.js"></script>
</body>
</html>
